version: '3.8'

services:
  backend:
    container_name: studymate-backend
    build: .
    ports:
      - "8080:8080"

    # Dòng này cực quan trọng: Nó tự động load toàn bộ biến trong file .env vào container
    env_file:
      - .env

    # Khai báo environment để map chính xác các biến vào Spring Boot
    environment:
      # 1. Database
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

      # 2. JWT
      - SIGNER_KEY=${SIGNER_KEY}
      - APP_JWT_EXPIRATION_MS=${APP_JWT_EXPIRATION_MS}

      # 3. Email
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}

      # 4. Gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}

      # 5. PayOS (Quan trọng để fix lỗi placeholder)
      - PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID}
      - PAYOS_API_KEY=${PAYOS_API_KEY}
      - PAYOS_CHECKSUM_KEY=${PAYOS_CHECKSUM_KEY}

      # 6. Frontend
      - FRONTEND_URL=${FRONTEND_URL}

    depends_on:
      - db
    networks:
      - studymate-network
    restart: on-failure

  db:
    image: postgres:16-alpine
    container_name: studymate-db
    environment:
      POSTGRES_DB: studymate_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - studymate-network
    restart: always

networks:
  studymate-network:
    driver: bridge

volumes:
  postgres_data: